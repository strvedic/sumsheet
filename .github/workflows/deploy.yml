name: Deploy to GitHub Pages

# Builds the web app and publishes it whenever main changes. Nothing needs to
# be built or pushed by hand, so the live site cannot drift from the source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A second push while the first is going out queues
# rather than races it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable

      # The tests run here too. A build that ships a broken worksheet is worse
      # than no build.
      - name: Engine tests
        working-directory: engine
        run: |
          dart pub get
          dart analyze lib
          dart test

      - name: App tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # The site lives at the root of sumsheet.aardhututoring.in, so asset
      # paths need no prefix. This was /sumsheet/ while the site was served
      # from strvedic.github.io/sumsheet/ - get this wrong against the domain
      # in web/CNAME and the page loads, then every asset 404s, and what the
      # teacher sees is a blank white screen with nothing in the console to
      # explain it.
      - name: Build
        working-directory: app
        run: flutter build web --release --base-href /

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
